<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>تحديث التطبيق — Elegance</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Tahoma, Arial, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        text-align: center;
        padding: 24px;
      }
      .box {
        max-width: 420px;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 28px 22px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 1.35rem;
      }
      p {
        margin: 0 0 18px;
        color: #cbd5e1;
        line-height: 1.6;
      }
      .ok {
        color: #5eead4;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>جاري تحديث التطبيق…</h1>
      <p id="status">بنمسح الكاش القديم ونحمّل النسخة الجديدة.</p>
    </div>
    <script>
      (async function () {
        const status = document.getElementById('status');
        try {
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map((r) => r.unregister()));
          }
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map((k) => caches.delete(k)));
          }
          try {
            localStorage.removeItem('ngsw:debug');
          } catch (_) {}
          status.textContent = 'تم المسح — هتفتح النسخة الجديدة الآن…';
          status.className = 'ok';
        } catch (e) {
          status.textContent = 'حصل خطأ بسيط — هنعمل إعادة تحميل برضه.';
        }
        setTimeout(function () {
          location.replace('/?updated=' + Date.now());
        }, 700);
      })();
    </script>
  </body>
</html>
